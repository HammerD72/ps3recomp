name: CPU surface latency accounting
on:
  push:
    branches: [combined, codex/d3d12-cpu-surface-profile, codex/d3d12-cpu-surface-boundary]
  pull_request:
jobs:
  accounting:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python tests/check_cpu_surface_profile.py
