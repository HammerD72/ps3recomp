name: Sized trace payloads
on:
  push:
    branches: [master, main, combined, 'codex/**']
    paths: ['include/ps3emu/sized_trace.h', 'include/ps3emu/native_atomic_observer.h', 'runtime/diag/sized_trace.c', 'tests/test_sized_trace.c', 'tools/test_sized_trace.py', '.github/workflows/sized-trace.yml']
  pull_request:
    paths: ['include/ps3emu/sized_trace.h', 'include/ps3emu/native_atomic_observer.h', 'runtime/diag/sized_trace.c', 'tests/test_sized_trace.c', 'tools/test_sized_trace.py', '.github/workflows/sized-trace.yml']
  workflow_dispatch:
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Complete payload storage and specific fault controls
        run: python tools/test_sized_trace.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sized-trace-${{ matrix.os }}
          path: build/sized-trace-tests
          retention-days: 5
