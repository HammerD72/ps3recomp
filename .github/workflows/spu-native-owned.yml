name: Experimental owned native jobs
on:
  push:
    branches: [master, main, combined, 'codex/**']
    paths: ['runtime/spu/**', 'runtime/platform/**', 'runtime/memory/**', 'include/**', 'tools/spu_lifter.py', 'tools/spu_disasm.py', 'tools/test_spu_native_owned.py', 'tools/test_spu_interpreter_handoff.py', '.github/workflows/spu-native-owned.yml']
  pull_request:
    paths: ['runtime/spu/**', 'runtime/platform/**', 'runtime/memory/**', 'include/**', 'tools/spu_lifter.py', 'tools/spu_disasm.py', 'tools/test_spu_native_owned.py', 'tools/test_spu_interpreter_handoff.py', '.github/workflows/spu-native-owned.yml']
  workflow_dispatch:
jobs:
  transitions:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/test_spu_native_owned.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spu-native-owned-${{ matrix.os }}
          path: |
            temp/checks/native-owned-*/**/*.log
            temp/checks/native-owned-*/**/*.json
            temp/checks/native-owned-*/**/spu_call_brackets.h
          retention-days: 5
