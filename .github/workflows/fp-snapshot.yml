name: Native fragment snapshot regression
on:
  push:
    branches: [master, main, combined, 'codex/**']
    paths: ['libs/video/rsx_fp_snapshot.h', 'libs/video/rsx_fp_decompiler.*', 'libs/video/tests/test_fp_snapshot.c', 'tools/test_fp_snapshot.py', '.github/workflows/fp-snapshot.yml']
  pull_request:
    paths: ['libs/video/rsx_fp_snapshot.h', 'libs/video/rsx_fp_decompiler.*', 'libs/video/tests/test_fp_snapshot.c', 'tools/test_fp_snapshot.py', '.github/workflows/fp-snapshot.yml']
  workflow_dispatch:
jobs:
  snapshot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/test_fp_snapshot.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp-snapshot-${{ matrix.os }}
          path: |
            build/fp-snapshot-tests/**/*.log
            build/fp-snapshot-tests/**/*.json
          retention-days: 5
