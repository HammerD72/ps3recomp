name: Guest read snapshot dispatch
on:
  workflow_dispatch:
  push:
    paths:
      - 'include/ps3emu/guest_read_sync.h'
      - 'runtime/memory/guest_read_sync.c'
      - 'runtime/memory/tests/guest_read_snapshot.cpp'
      - 'tools/test_guest_read_snapshot.py'
      - '.github/workflows/guest-read-snapshot.yml'
  pull_request:
    paths:
      - 'include/ps3emu/guest_read_sync.h'
      - 'runtime/memory/guest_read_sync.c'
      - 'runtime/memory/tests/guest_read_snapshot.cpp'
      - 'tools/test_guest_read_snapshot.py'
      - '.github/workflows/guest-read-snapshot.yml'
jobs:
  dispatch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python tools/test_guest_read_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-dispatch-${{ matrix.os }}
          path: temp/checks/guest-snapshot-*/result.json
