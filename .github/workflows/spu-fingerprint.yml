name: SPU fingerprint cache
on:
  push:
    branches: [master, main, combined, codex/spu-fingerprint-cache]
    paths: ['runtime/spu/spu_fingerprint_cache.h', 'runtime/spu/spu_workload.c', 'tools/test_spu_fingerprint_cache.py', '.github/workflows/spu-fingerprint.yml']
  pull_request:
    paths: ['runtime/spu/spu_fingerprint_cache.h', 'runtime/spu/spu_workload.c', 'tools/test_spu_fingerprint_cache.py', '.github/workflows/spu-fingerprint.yml']
  workflow_dispatch:
jobs:
  fingerprint:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/test_spu_fingerprint_cache.py
